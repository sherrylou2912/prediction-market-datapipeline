[project]
name = "prediction-market-data"
version = "0.1.0"
description = "Versioned, auditable data pipeline for prediction-market research"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.4.2",
    "pyarrow>=18.0.0",
    "python-dotenv>=1.2.1",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.ruff]
target-version = "py39"
line-length = 120
exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
